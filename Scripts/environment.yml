name: timelapse_env

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-image
  - tifffile
  - tqdm
  - pip

  # PyTorch (GPU version handled automatically where possible)
  - pytorch
  - torchvision
  - torchaudio

  # pip-only packages
  - pip:
      - cellpose
      - aicspylibczi